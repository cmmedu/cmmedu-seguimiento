[tool:pytest]
DJANGO_SETTINGS_MODULE = lms.envs.test
testpaths = cmmedu_seguimiento
addopts = --nomigrations --reuse-db --durations=20 --json-report --json-report-omit keywords streams collectors log traceback tests --json-report-file=none --cov=cmmedu_seguimiento/ --cov-report term-missing --cov-report xml:reports/coverage/coverage.xml --cov-fail-under 85
# Enable default handling for all warnings, including those that are ignored by default;
# but hide rate-limit warnings (because we deliberately don't throttle test user logins),
# field_data deprecation warnings (because fixing them requires a major low-priority refactoring),
# and warnings that originate outside cmmedu_seguimiento's own code (edx-platform core, bundled
# forks, and third-party/edX apps loaded as a side effect of the LMS test settings) -- see
# SUPPRESSED_WARNINGS.md for the full breakdown of what each one is and why it's not actionable here.
filterwarnings =
    default
    ignore:No request passed to the backend, unable to rate-limit:UserWarning
    ignore::xblock.exceptions.FieldDataDeprecationWarning
    ignore:defusedxml\.lxml is no longer supported
    ignore:the imp module is deprecated in favour of importlib
    ignore:Using or importing the ABCs from 'collections' instead of from 'collections\.abc'
    ignore:`formatargspec` is deprecated since Python 3\.5
    ignore:The DEFAULT_CONTENT_TYPE setting is deprecated\.
    ignore:The FILE_CHARSET setting is deprecated\.
    ignore:Importing .* instead of common\.djangoapps\..* is deprecated
    ignore:invalid escape sequence
junit_family = xunit2
norecursedirs = .* *.egg build conf dist node_modules test_root wf_tmp
python_classes =
python_files = tests.py

[coverage:run]
omit =
    */migrations/*